name: enhanced_http
description: "An enhanced HTTP client with comprehensive error handling, interceptors, CURL logging, and multipart upload support."
version: 1.0.0
homepage: "https://github.com/bienvenuelisis"
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  auth_token_service:
    git:
      url: https://github.com/bienvenuelisis/auth_token_service
  flutter:
    sdk: flutter
  http: ^1.3.0
  simple_logger:
    git:
      url: https://github.com/bienvenuelisis/simple_logger

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
